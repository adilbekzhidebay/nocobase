{{- if hasKey .Values "persistentVolume" }}
{{- if .Values.persistentVolume.enabled -}}
{{- if and (not .Values.persistentVolume.existingClaim) (not .Values.persistentVolume.emptyDirSizeLimit) (not .Values.persistentVolume.hostPath) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  {{- if .Values.persistentVolume.annotations }}
  annotations:
{{ toYaml .Values.persistentVolume.annotations | indent 4 }}
  {{- end }}
  {{- if .Values.persistentVolume.labels }}
  labels:
{{ toYaml .Values.persistentVolume.labels | indent 4 }}
  {{- end }}
  name: {{ .Values.persistentVolume.volumeName }}
spec:
  accessModes:
{{ toYaml .Values.persistentVolume.accessModes | indent 4 }}
  resources:
    requests:
      storage: "{{ .Values.persistentVolume.size }}"
{{- if .Values.persistentVolume.volumeName }}
  volumeName: "{{ .Values.persistentVolume.volumeName }}"
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
